<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book List | Imperial International School</title>
    <!-- استدعاء الخط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #184152;
            --primary-dark: #0b222d;
            --accent: #9bc1aa;
            --accent-hover: #7fae91;
            --bg-light: #f7faf9;
            --white: #ffffff;
            --text-dark: #1f2d34;
            --text-muted: #5c707a;
            --shadow-sm: 0 4px 20px rgba(24, 65, 82, 0.05);
            --glass-border: rgba(155, 193, 170, 0.3);
            --header-bg: rgba(255, 255, 255, 0.95);
        }

        [data-theme="dark"] {
            --primary: #24586e;
            --primary-dark: #061218;
            --accent: #aed3bc;
            --accent-hover: #91bda1;
            --bg-light: #081116;
            --white: #122129;
            --text-dark: #f0f5f8;
            --text-muted: #8ca2ad;
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --header-bg: rgba(18, 33, 41, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.7;
        }

        .container {
            width: 90%;
            max-width: 1240px;
            margin: 0 auto;
        }

        header {
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 8px 0;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container img {
            height: 90px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 18px;
        }

        .nav-links li a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 0.92rem;
            transition: 0.3s;
            padding: 6px 4px;
        }

        .nav-links li a:hover, .nav-links li a.active {
            color: var(--accent-hover);
        }

        .main-content {
            padding: 160px 0 80px 0;
            min-height: calc(100vh - 180px);
        }

        .about-card {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 30px;
        }

        .about-card h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 10px;
        }

        [data-theme="dark"] .about-card h1 {
            color: var(--accent);
        }

        .pdf-section {
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
        }

        .pdf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .pdf-header h2 {
            font-size: 1.6rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        [data-theme="dark"] .pdf-header h2 {
            color: var(--accent);
        }

        .download-btn {
            background: var(--accent);
            color: #0b222d;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            background: var(--accent-hover);
        }

        .pdf-frame-container {
            width: 100%;
            height: 750px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            background: var(--bg-light);
        }

        .pdf-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            background: var(--primary-dark);
            color: #ffffff;
            padding: 30px 0;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo-container">
                <img src="images/imperial-logo.png" alt="Logo" class="school-logo">
            </a>
            
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="about-card">
                <h1>Book List</h1>
                <p>View and download the official school book list.</p>
            </div>

            <!-- عرض ملف قائمة الكتب -->
            <section class="pdf-section">
                <div class="pdf-header">
                    <h2><i class="fa-solid fa-book"></i> School Book List (2025-2026)</h2>
                    <a href="IIS%20Profile/Book-List-2025-2026-1.pdf" download class="download-btn">
                        <i class="fa-solid fa-download"></i> Download PDF
                    </a>
                </div>
                <div class="pdf-frame-container">
                    <iframe src="IIS%20Profile/Book-List-2025-2026-1.pdf">
                        <p>Your browser does not support embedded PDFs. <a href="IIS%20Profile/Book-List-2025-2026-1.pdf">Click here to download</a>.</p>
                    </iframe>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>All rights reserved © 2026 Imperial International School</p>
        </div>
    </footer>
</body>
</html>
