<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Imperial International School</title>
    <!-- استدعاء خط كايرو وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #184152;
            --primary-dark: #0b222d;
            --accent: #9bc1aa;
            --accent-hover: #7fae91;
            --accent-light: rgba(155, 193, 170, 0.12);
            --bg-light: #f7faf9;
            --white: #ffffff;
            --text-dark: #1f2d34;
            --text-muted: #5c707a;
            --shadow-sm: 0 4px 20px rgba(24, 65, 82, 0.05);
            --glass-border: rgba(155, 193, 170, 0.3);
            --header-bg: rgba(255, 255, 255, 0.95);
        }

        [data-theme="dark"] {
            --primary: #24586e;
            --primary-dark: #061218;
            --accent: #aed3bc;
            --accent-hover: #91bda1;
            --accent-light: rgba(174, 211, 188, 0.1);
            --bg-light: #081116;
            --white: #122129;
            --text-dark: #f0f5f8;
            --text-muted: #8ca2ad;
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --header-bg: rgba(18, 33, 41, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.7;
        }

        .container {
            width: 90%;
            max-width: 1240px;
            margin: 0 auto;
        }

        header {
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 8px 0;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container img {
            height: 90px;
            object-fit: contain;
        }

        .nav-right-group {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 18px;
        }

        .nav-links li a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 0.92rem;
            transition: 0.3s;
            padding: 6px 4px;
        }

        .nav-links li a:hover, 
        .nav-links li a.active {
            color: var(--accent-hover);
        }

        .controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .theme-btn, .lang-btn {
            background: rgba(155, 193, 170, 0.15);
            border: 1px solid var(--accent);
            color: var(--text-dark);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-btn:hover, .lang-btn:hover {
            background: var(--accent);
            color: #0b222d;
        }

        .main-content {
            padding: 160px 0 80px 0;
        }

        .contact-hero {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 40px;
            text-align: center;
        }

        .contact-hero h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 10px;
        }

        [data-theme="dark"] .contact-hero h1 {
            color: var(--accent);
        }

        .contact-hero p {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto;
        }

        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .section-card {
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .section-card h3 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--accent-light);
            padding-bottom: 10px;
        }

        [data-theme="dark"] .section-card h3 {
            color: var(--accent);
        }

        .contact-person {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--glass-border);
        }

        .contact-person:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .contact-person span.title {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .contact-person h4 {
            font-size: 1.05rem;
            color: var(--text-dark);
            font-weight: 800;
            margin: 3px 0;
        }

        .contact-person a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            background: var(--accent-light);
            padding: 6px 12px;
            border-radius: 10px;
            margin-top: 5px;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        [data-theme="dark"] .contact-person a {
            color: var(--accent);
        }

        .contact-person a:hover {
            background: var(--accent);
            color: #0b222d;
        }

        .info-extras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .extra-card {
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
        }

        .extra-card h3 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        [data-theme="dark"] .extra-card h3 {
            color: var(--accent);
        }

        .map-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent);
            color: #0b222d;
            padding: 12px 25px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 800;
            margin-top: 15px;
            transition: 0.3s;
        }

        .map-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        footer {
            background: var(--primary-dark);
            color: #ffffff;
            padding: 30px 0
